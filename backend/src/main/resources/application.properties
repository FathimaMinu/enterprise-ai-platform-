# ============================================================
# Enterprise AI Platform — Base Application Properties
# Profile-specific overrides live in application-dev.properties
# and application-prod.properties.
# ============================================================

# ---- Application -------------------------------------------
spring.application.name=enterprise-ai-backend
server.port=8080

# Default to dev profile locally; override with -Dspring.profiles.active=prod
spring.profiles.default=dev

# ---- JPA (common) ------------------------------------------
# Dialect is auto-detected per profile; do NOT set it here.
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---- JWT ---------------------------------------------------
# Secret MUST be supplied via environment variable JWT_SECRET.
# No default — application will fail to start if missing.
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ---- CORS --------------------------------------------------
# Supplied via environment variable; set per-environment.
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---- OpenAI / AI Service -----------------------------------
openai.api.key=${OPENAI_API_KEY:}
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

# ---- Logging (base — overridden per profile) ---------------
logging.level.root=INFO
logging.level.com.enterpriseai=INFO
