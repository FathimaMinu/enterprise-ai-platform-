<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" width="1440" height="600" preserveAspectRatio="xMidYMid slice">
  <defs>

    <!-- Base dark background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#020617"/>
      <stop offset="40%"  stop-color="#0a1628"/>
      <stop offset="70%"  stop-color="#0d1f3c"/>
      <stop offset="100%" stop-color="#0c0f2a"/>
    </linearGradient>

    <!-- Blue radial glow — left cluster -->
    <radialGradient id="glow1" cx="25%" cy="45%" r="38%">
      <stop offset="0%"   stop-color="#1d4ed8" stop-opacity="0.35"/>
      <stop offset="60%"  stop-color="#2563eb" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>

    <!-- Purple radial glow — right cluster -->
    <radialGradient id="glow2" cx="78%" cy="55%" r="35%">
      <stop offset="0%"   stop-color="#7c3aed" stop-opacity="0.32"/>
      <stop offset="55%"  stop-color="#6d28d9" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyan accent glow — top right -->
    <radialGradient id="glow3" cx="88%" cy="15%" r="25%">
      <stop offset="0%"   stop-color="#0891b2" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>

    <!-- Node glow filter -->
    <filter id="nodeGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Soft edge glow for major nodes -->
    <filter id="bigGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Line gradient: blue to purple -->
    <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#3b82f6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Line gradient: purple to cyan -->
    <linearGradient id="lineGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Line gradient: blue fading out -->
    <linearGradient id="lineGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#2563eb" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Particle glow -->
    <filter id="partGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

  </defs>

  <!-- ── LAYER 1: solid background ── -->
  <rect width="1440" height="600" fill="url(#bg)"/>

  <!-- ── LAYER 2: ambient glow pools ── -->
  <ellipse cx="360" cy="270" rx="480" ry="340" fill="url(#glow1)"/>
  <ellipse cx="1120" cy="330" rx="420" ry="300" fill="url(#glow2)"/>
  <ellipse cx="1270" cy="90"  rx="280" ry="200" fill="url(#glow3)"/>

  <!-- ── LAYER 3: subtle grid ── -->
  <g opacity="0.045" stroke="#60a5fa" stroke-width="0.6">
    <!-- Horizontal lines -->
    <line x1="0" y1="75"  x2="1440" y2="75"/>
    <line x1="0" y1="150" x2="1440" y2="150"/>
    <line x1="0" y1="225" x2="1440" y2="225"/>
    <line x1="0" y1="300" x2="1440" y2="300"/>
    <line x1="0" y1="375" x2="1440" y2="375"/>
    <line x1="0" y1="450" x2="1440" y2="450"/>
    <line x1="0" y1="525" x2="1440" y2="525"/>
    <!-- Vertical lines -->
    <line x1="120"  y1="0" x2="120"  y2="600"/>
    <line x1="240"  y1="0" x2="240"  y2="600"/>
    <line x1="360"  y1="0" x2="360"  y2="600"/>
    <line x1="480"  y1="0" x2="480"  y2="600"/>
    <line x1="600"  y1="0" x2="600"  y2="600"/>
    <line x1="720"  y1="0" x2="720"  y2="600"/>
    <line x1="840"  y1="0" x2="840"  y2="600"/>
    <line x1="960"  y1="0" x2="960"  y2="600"/>
    <line x1="1080" y1="0" x2="1080" y2="600"/>
    <line x1="1200" y1="0" x2="1200" y2="600"/>
    <line x1="1320" y1="0" x2="1320" y2="600"/>
  </g>

  <!-- ── LAYER 4: neural network edges ── -->
  <g fill="none">

    <!-- Left cluster connections -->
    <line x1="180" y1="140" x2="310" y2="220" stroke="url(#lineGrad1)" stroke-width="1.2"/>
    <line x1="180" y1="140" x2="260" y2="300" stroke="url(#lineGrad1)" stroke-width="0.9"/>
    <line x1="180" y1="140" x2="420" y2="160" stroke="url(#lineGrad3)" stroke-width="1.0"/>
    <line x1="310" y1="220" x2="420" y2="160" stroke="url(#lineGrad1)" stroke-width="1.1"/>
    <line x1="310" y1="220" x2="260" y2="300" stroke="url(#lineGrad1)" stroke-width="0.8"/>
    <line x1="310" y1="220" x2="450" y2="310" stroke="url(#lineGrad1)" stroke-width="1.0"/>
    <line x1="260" y1="300" x2="150" y2="400" stroke="url(#lineGrad3)" stroke-width="0.8"/>
    <line x1="260" y1="300" x2="380" y2="420" stroke="url(#lineGrad1)" stroke-width="0.9"/>
    <line x1="420" y1="160" x2="560" y2="200" stroke="url(#lineGrad1)" stroke-width="1.1"/>
    <line x1="450" y1="310" x2="560" y2="200" stroke="url(#lineGrad1)" stroke-width="0.9"/>
    <line x1="450" y1="310" x2="380" y2="420" stroke="url(#lineGrad1)" stroke-width="0.8"/>
    <line x1="80"  y1="260" x2="180" y2="140" stroke="url(#lineGrad3)" stroke-width="0.7"/>
    <line x1="80"  y1="260" x2="260" y2="300" stroke="url(#lineGrad3)" stroke-width="0.8"/>
    <line x1="80"  y1="260" x2="150" y2="400" stroke="url(#lineGrad3)" stroke-width="0.7"/>

    <!-- Mid connections -->
    <line x1="560" y1="200" x2="700" y2="140" stroke="url(#lineGrad1)" stroke-width="1.2"/>
    <line x1="560" y1="200" x2="680" y2="290" stroke="url(#lineGrad1)" stroke-width="1.0"/>
    <line x1="700" y1="140" x2="820" y2="180" stroke="url(#lineGrad1)" stroke-width="1.1"/>
    <line x1="700" y1="140" x2="760" y2="60"  stroke="url(#lineGrad3)" stroke-width="0.8"/>
    <line x1="680" y1="290" x2="820" y2="180" stroke="url(#lineGrad1)" stroke-width="0.9"/>
    <line x1="680" y1="290" x2="760" y2="380" stroke="url(#lineGrad2)" stroke-width="1.0"/>
    <line x1="380" y1="420" x2="500" y2="490" stroke="url(#lineGrad2)" stroke-width="0.8"/>
    <line x1="380" y1="420" x2="520" y2="380" stroke="url(#lineGrad1)" stroke-width="0.9"/>
    <line x1="520" y1="380" x2="680" y2="290" stroke="url(#lineGrad1)" stroke-width="0.8"/>
    <line x1="520" y1="380" x2="760" y2="380" stroke="url(#lineGrad2)" stroke-width="0.9"/>

    <!-- Right cluster connections -->
    <line x1="820"  y1="180" x2="960"  y2="130" stroke="url(#lineGrad1)" stroke-width="1.1"/>
    <line x1="820"  y1="180" x2="940"  y2="260" stroke="url(#lineGrad2)" stroke-width="1.0"/>
    <line x1="760"  y1="380" x2="940"  y2="260" stroke="url(#lineGrad2)" stroke-width="1.0"/>
    <line x1="760"  y1="380" x2="880"  y2="450" stroke="url(#lineGrad2)" stroke-width="0.9"/>
    <line x1="960"  y1="130" x2="1080" y2="190" stroke="url(#lineGrad1)" stroke-width="1.1"/>
    <line x1="960"  y1="130" x2="1050" y2="70"  stroke="url(#lineGrad3)" stroke-width="0.8"/>
    <line x1="940"  y1="260" x2="1080" y2="190" stroke="url(#lineGrad2)" stroke-width="0.9"/>
    <line x1="940"  y1="260" x2="1050" y2="340" stroke="url(#lineGrad2)" stroke-width="1.0"/>
    <line x1="880"  y1="450" x2="1050" y2="340" stroke="url(#lineGrad2)" stroke-width="0.9"/>
    <line x1="880"  y1="450" x2="980"  y2="490" stroke="url(#lineGrad2)" stroke-width="0.7"/>
    <line x1="1080" y1="190" x2="1200" y2="140" stroke="url(#lineGrad1)" stroke-width="1.2"/>
    <line x1="1080" y1="190" x2="1180" y2="280" stroke="url(#lineGrad2)" stroke-width="1.0"/>
    <line x1="1050" y1="340" x2="1180" y2="280" stroke="url(#lineGrad2)" stroke-width="0.9"/>
    <line x1="1050" y1="340" x2="1150" y2="420" stroke="url(#lineGrad2)" stroke-width="0.8"/>
    <line x1="1200" y1="140" x2="1340" y2="100" stroke="url(#lineGrad1)" stroke-width="1.0"/>
    <line x1="1200" y1="140" x2="1310" y2="220" stroke="url(#lineGrad1)" stroke-width="0.9"/>
    <line x1="1180" y1="280" x2="1310" y2="220" stroke="url(#lineGrad2)" stroke-width="0.9"/>
    <line x1="1180" y1="280" x2="1280" y2="360" stroke="url(#lineGrad2)" stroke-width="0.8"/>
    <line x1="1150" y1="420" x2="1280" y2="360" stroke="url(#lineGrad2)" stroke-width="0.8"/>
    <line x1="1340" y1="100" x2="1420" y2="160" stroke="url(#lineGrad3)" stroke-width="0.7"/>
    <line x1="1310" y1="220" x2="1420" y2="160" stroke="url(#lineGrad1)" stroke-width="0.8"/>

    <!-- Cross connections for depth -->
    <line x1="150"  y1="400" x2="380"  y2="420" stroke="url(#lineGrad3)" stroke-width="0.6"/>
    <line x1="500"  y1="490" x2="760"  y2="380" stroke="url(#lineGrad2)" stroke-width="0.6"/>
    <line x1="980"  y1="490" x2="1150" y2="420" stroke="url(#lineGrad2)" stroke-width="0.6"/>
    <line x1="760"  y1="60"  x2="960"  y2="130" stroke="url(#lineGrad3)" stroke-width="0.6"/>
  </g>

  <!-- ── LAYER 5: secondary small nodes ── -->
  <g filter="url(#partGlow)">
    <!-- Left cluster -->
    <circle cx="80"  cy="260" r="3.5" fill="#3b82f6" opacity="0.7"/>
    <circle cx="150" cy="400" r="3"   fill="#3b82f6" opacity="0.6"/>
    <circle cx="420" cy="160" r="4"   fill="#60a5fa" opacity="0.75"/>
    <circle cx="450" cy="310" r="3.5" fill="#60a5fa" opacity="0.7"/>
    <circle cx="380" cy="420" r="3.5" fill="#818cf8" opacity="0.65"/>
    <circle cx="500" cy="490" r="3"   fill="#7c3aed" opacity="0.55"/>
    <!-- Mid -->
    <circle cx="560" cy="200" r="4"   fill="#60a5fa" opacity="0.75"/>
    <circle cx="520" cy="380" r="3.5" fill="#818cf8" opacity="0.65"/>
    <circle cx="760" cy="60"  r="3"   fill="#3b82f6" opacity="0.6"/>
    <circle cx="760" cy="380" r="4"   fill="#a78bfa" opacity="0.7"/>
    <!-- Right cluster -->
    <circle cx="880"  cy="450" r="3.5" fill="#a78bfa" opacity="0.65"/>
    <circle cx="980"  cy="490" r="3"   fill="#7c3aed" opacity="0.55"/>
    <circle cx="1050" cy="70"  r="3"   fill="#60a5fa" opacity="0.6"/>
    <circle cx="1050" cy="340" r="4"   fill="#a78bfa" opacity="0.7"/>
    <circle cx="1150" cy="420" r="3.5" fill="#a78bfa" opacity="0.65"/>
    <circle cx="1280" cy="360" r="3.5" fill="#7c3aed" opacity="0.6"/>
    <circle cx="1340" cy="100" r="3"   fill="#60a5fa" opacity="0.65"/>
    <circle cx="1420" cy="160" r="3"   fill="#3b82f6" opacity="0.6"/>
  </g>

  <!-- ── LAYER 6: major nodes (hub nodes) ── -->
  <g filter="url(#nodeGlow)">
    <!-- Left cluster hubs -->
    <circle cx="180" cy="140" r="7"   fill="#2563eb" opacity="0.9"/>
    <circle cx="310" cy="220" r="8.5" fill="#3b82f6" opacity="0.95"/>
    <circle cx="260" cy="300" r="6"   fill="#2563eb" opacity="0.85"/>
    <!-- Mid hubs -->
    <circle cx="680" cy="290" r="8"   fill="#6366f1" opacity="0.9"/>
    <circle cx="700" cy="140" r="7"   fill="#60a5fa" opacity="0.9"/>
    <circle cx="820" cy="180" r="9"   fill="#6366f1" opacity="0.95"/>
    <!-- Right hubs -->
    <circle cx="940"  cy="260" r="8.5" fill="#7c3aed" opacity="0.9"/>
    <circle cx="960"  cy="130" r="7"   fill="#818cf8" opacity="0.9"/>
    <circle cx="1080" cy="190" r="8"   fill="#7c3aed" opacity="0.9"/>
    <circle cx="1180" cy="280" r="7.5" fill="#a78bfa" opacity="0.85"/>
    <circle cx="1200" cy="140" r="7"   fill="#818cf8" opacity="0.9"/>
    <circle cx="1310" cy="220" r="6"   fill="#7c3aed" opacity="0.85"/>
  </g>

  <!-- ── LAYER 7: primary hub nodes with big glow ── -->
  <g filter="url(#bigGlow)">
    <circle cx="310" cy="220" r="5"   fill="#60a5fa" opacity="1"/>
    <circle cx="820" cy="180" r="5.5" fill="#818cf8" opacity="1"/>
    <circle cx="940" cy="260" r="5"   fill="#a78bfa" opacity="1"/>
    <circle cx="1080" cy="190" r="5"  fill="#c4b5fd" opacity="1"/>
  </g>

  <!-- ── LAYER 8: floating particles ── -->
  <g filter="url(#partGlow)" opacity="0.55">
    <circle cx="46"   cy="80"  r="1.8" fill="#60a5fa"/>
    <circle cx="135"  cy="55"  r="1.4" fill="#818cf8"/>
    <circle cx="230"  cy="510" r="1.6" fill="#60a5fa"/>
    <circle cx="470"  cy="540" r="1.5" fill="#a78bfa"/>
    <circle cx="600"  cy="500" r="1.8" fill="#6366f1"/>
    <circle cx="640"  cy="450" r="1.4" fill="#60a5fa"/>
    <circle cx="850"  cy="520" r="1.6" fill="#7c3aed"/>
    <circle cx="1000" cy="560" r="1.5" fill="#a78bfa"/>
    <circle cx="1100" cy="500" r="1.4" fill="#818cf8"/>
    <circle cx="1230" cy="480" r="1.8" fill="#7c3aed"/>
    <circle cx="1380" cy="420" r="1.6" fill="#a78bfa"/>
    <circle cx="1400" cy="300" r="1.4" fill="#60a5fa"/>
    <circle cx="1360" cy="520" r="1.5" fill="#7c3aed"/>
    <circle cx="20"   cy="400" r="1.6" fill="#3b82f6"/>
    <circle cx="35"   cy="520" r="1.3" fill="#6366f1"/>
    <circle cx="620"  cy="90"  r="1.5" fill="#60a5fa"/>
    <circle cx="880"  cy="80"  r="1.6" fill="#818cf8"/>
    <circle cx="1130" cy="60"  r="1.4" fill="#60a5fa"/>
  </g>

  <!-- ── LAYER 9: data-flow pulse dots on key edges ── -->
  <g fill="#93c5fd" opacity="0.8">
    <circle cx="245" cy="180" r="2.2"/>
    <circle cx="365" cy="190" r="2"/>
    <circle cx="630" cy="170" r="2.2"/>
    <circle cx="760" cy="160" r="2"/>
    <circle cx="890" cy="220" r="2.2"/>
    <circle cx="1010" cy="160" r="2"/>
    <circle cx="1140" cy="165" r="2.2"/>
    <circle cx="1250" cy="180" r="2"/>
  </g>
  <g fill="#c4b5fd" opacity="0.7">
    <circle cx="600"  cy="245" r="2"/>
    <circle cx="720"  cy="335" r="2.2"/>
    <circle cx="850"  cy="370" r="2"/>
    <circle cx="1010" cy="300" r="2.2"/>
    <circle cx="1115" cy="310" r="2"/>
    <circle cx="1215" cy="330" r="2"/>
  </g>

</svg>
