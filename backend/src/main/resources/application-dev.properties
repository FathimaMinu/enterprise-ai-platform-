# ============================================================
# Enterprise AI Platform — DEV Profile
# Active when: spring.profiles.active=dev (default locally)
# ============================================================

# ---- H2 In-Memory Database ---------------------------------
spring.datasource.url=jdbc:h2:mem:enterpriseai;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---- H2 Console (dev only) ---------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ---- JPA ---------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- Flyway (disabled in dev — Hibernate manages schema) ---
spring.flyway.enabled=false

# ---- JWT (dev fallback — OVERRIDE in real env) -------------
# This value is ONLY for local dev convenience.
# Always set JWT_SECRET env var in any shared environment.
jwt.secret=${JWT_SECRET:dev-only-secret-do-not-use-in-production-min-64-chars-xxxxxxxx}

# ---- CORS --------------------------------------------------
cors.allowed.origins=http://localhost:5173,http://localhost:5174,http://localhost:3000

# ---- Logging (verbose for dev) ----------------------------
logging.level.org.springframework.security=DEBUG
logging.level.com.enterpriseai=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
