# ============================================================
# Enterprise AI Platform — PROD Profile
# Active when: spring.profiles.active=prod
# All secrets MUST come from environment variables.
# ============================================================

# ---- PostgreSQL --------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ---- JPA ---------------------------------------------------
# validate: Flyway owns the schema; Hibernate only validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ---- Flyway ------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# ---- H2 Console (DISABLED in prod) ------------------------
spring.h2.console.enabled=false

# ---- CORS --------------------------------------------------
cors.allowed.origins=${CORS_ALLOWED_ORIGINS}

# ---- Logging (minimal in prod) ----------------------------
logging.level.root=WARN
logging.level.com.enterpriseai=INFO
logging.level.org.springframework.security=WARN

# ---- Server ------------------------------------------------
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
